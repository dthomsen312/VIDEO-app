<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VIDEO</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIDEO">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }

  /* The preview is a 9:16 box — the exact shape that gets recorded — rather
     than filling the whole 19.5:9 screen. Filling the screen would crop the
     frame a second time on top of the capture crop, which reads as zoom. */
  #preview {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100%; max-width: 100%; max-height: 100%;
    aspect-ratio: 9 / 16;
    object-fit: cover; background: #000;
  }

  #recFrame {
    position: fixed; inset: 0;
    border: 10px solid #ff3b30;
    pointer-events: none; opacity: 0;
    transition: opacity .15s;
  }
  #recFrame.on { opacity: 1; }

  .ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 16px
             calc(env(safe-area-inset-bottom) + 10px);
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }

  .status {
    display: flex; align-items: center; gap: 10px; align-self: flex-start;
    background: rgba(0,0,0,.55); border-radius: 999px;
    padding: 11px 18px; font-size: 20px; font-weight: 700;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #888; }
  .dot.ready { background: #fff; }
  .dot.waiting { background: #ffd60a; }
  .dot.warming { background: #ff9f0a; }
  .dot.rec { background: #ff3b30; }

  #lensBtn {
    position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top) + 12px); right: 16px;
    background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 18px; font-size: 15px; font-weight: 700; font-family: inherit;
    max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lensBtn:disabled { opacity: .3; }
  #lensBtn[hidden] { display: none; }

  .spacer { flex: 1; }

  .dial {
    background: rgba(0,0,0,.5); border-radius: 28px;
    padding: 16px 30px; text-align: center;
  }
  /* Pure black while the camera sleeps: unlit OLED pixels draw no power. */
  .dial.asleep { background: #000; }
  .dial b {
    display: block; font-size: 88px; line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .dial.rec b { color: #ff3b30; }
  .dial span { font-size: 17px; font-weight: 600; opacity: .85; }

  .tally {
    background: rgba(0,0,0,.5); border-radius: 18px;
    padding: 10px 16px; margin-bottom: 12px; width: 100%;
    text-align: center; font-size: 17px; font-weight: 600;
  }
  .tally em { display: block; font-style: normal; font-size: 13px; opacity: .7; margin-top: 3px; }
  .tally em.warn { color: #ffd60a; }

  .controls { display: flex; gap: 14px; width: 100%; }
  .big {
    flex: 1; height: 140px; border: 0; border-radius: 26px;
    color: #fff; font-size: 30px; font-weight: 800; letter-spacing: .5px;
    font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .big svg { width: 44px; height: 44px; fill: currentColor; }
  .big.start { background: #30d158; }
  .big.stop  { background: #ff3b30; }
  .big:disabled { opacity: .25; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; text-align: center; gap: 14px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; font-size: 16px; line-height: 1.45; opacity: .85; max-width: 30em; }
  .overlay button {
    border: 0; border-radius: 20px; padding: 20px 28px; width: 100%; max-width: 360px;
    font-size: 22px; font-weight: 800; color: #fff; background: #0a84ff; font-family: inherit;
  }
  .overlay button.ghost { background: transparent; color: #9b9ba1; font-size: 17px; padding: 12px; }
</style>
</head>
<body>

<video id="preview" playsinline autoplay muted></video>
<div id="recFrame"></div>

<div class="ui">
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Ready</span></div>
  <div class="spacer"></div>
  <div class="dial" id="dial"><b id="dialNum">--</b><span id="dialCap">10s clip every 2 min</span></div>
  <div class="spacer"></div>
  <div class="tally"><span id="tallyMain">No clips yet</span><em id="tallySub">Reels format · 1080×1920 · 30 fps</em></div>
  <div class="controls">
    <button class="big start" id="startBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>START
    </button>
    <button class="big stop" id="stopBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>STOP
    </button>
  </div>
</div>

<button id="lensBtn" hidden>LENS</button>

<div class="overlay" id="gate" hidden>
  <h2>VIDEO</h2>
  <p id="gateText">This app needs your camera and microphone to record clips.</p>
  <button id="gateBtn">ENABLE CAMERA</button>
</div>

<div class="overlay" id="sheet" hidden>
  <h2>Session finished</h2>
  <p id="sheetSummary"></p>
  <button id="saveBtn">SAVE TO PHOTOS</button>
  <p>Choose <b>Save Videos</b> in the share sheet. They land in Photos under Recents.</p>
  <button class="ghost" id="laterBtn">Keep recording instead</button>
</div>

<script>
(() => {
  'use strict';

  // ---- Instagram Reels target --------------------------------------------
  // Reels is 9:16 and Instagram re-encodes everything down to 1080 wide, so
  // 1080x1920 is the highest resolution that survives intact. The 9:16 shaping
  // happens in the canvas below, NOT as a getUserMedia constraint — asking the
  // camera for a 9:16 aspect ratio makes Safari crop into a natively 4:3
  // sensor, which looks like a permanent zoom.
  const TARGET_W  = 1080;
  const TARGET_H  = 1920;
  const TARGET_FPS = 30;
  const VIDEO_BPS = 10000000;
  const AUDIO_BPS = 128000;

  const CLIP_MS  = 10000;   // length of each clip
  const CYCLE_MS = 120000;  // start-of-clip to start-of-clip
  // Camera is powered down between clips. It is woken this far ahead so
  // auto-exposure and white balance have settled before recording starts.
  const WARMUP_MS = 3000;

  const LENS_KEY = 'video.lensId';

  const $ = id => document.getElementById(id);
  const preview = $('preview'), recFrame = $('recFrame'), dial = $('dial');
  const dot = $('dot'), statusText = $('statusText');
  const dialNum = $('dialNum'), dialCap = $('dialCap');
  const tallyMain = $('tallyMain'), tallySub = $('tallySub');
  const startBtn = $('startBtn'), stopBtn = $('stopBtn'), lensBtn = $('lensBtn');
  const gate = $('gate'), gateText = $('gateText'), gateBtn = $('gateBtn');
  const sheet = $('sheet'), sheetSummary = $('sheetSummary');
  const saveBtn = $('saveBtn'), laterBtn = $('laterBtn');

  let stream = null, mime = '', recorder = null, chunks = [];
  let clips = [], totalBytes = 0;
  let state = 'idle';       // idle | waiting | warming | recording
  let anchor = 0, nextIndex = 0, clipEnd = 0, clipStartedAt = 0;
  let tickTimer = null, clipTimer = null, wakeLock = null;
  let acquiring = false, acquireFailures = 0, keepCameraAwake = false;
  let sourceLabel = '';
  let lenses = [], lensIndex = 0, lensesLoaded = false;

  let canvas = null, canvasCtx = null, canvasStream = null, drawing = false;

  // ---- codec --------------------------------------------------------------

  function pickMime() {
    const options = [
      'video/mp4;codecs=avc1.640028,mp4a.40.2',
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    if (typeof MediaRecorder === 'undefined') return null;
    const found = options.find(t => MediaRecorder.isTypeSupported(t));
    return found === undefined ? '' : found;
  }

  // ---- camera power -------------------------------------------------------

  async function acquireCamera() {
    if (stream) return true;
    if (acquiring) return false;
    acquiring = true;

    // Deliberately loose. No aspectRatio, and resolution asked for only as a
    // hint on the long edge — over-constraining is what made Safari crop the
    // sensor. The canvas handles Reels shaping afterwards.
    const video = {
      width:  { ideal: TARGET_H },
      height: { ideal: TARGET_H },
      frameRate: { ideal: TARGET_FPS, max: TARGET_FPS }
    };

    const chosen = lenses[lensIndex];
    if (chosen && chosen.deviceId) video.deviceId = { exact: chosen.deviceId };
    else video.facingMode = { ideal: 'environment' };

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
    } catch (err) {
      try {
        // A refused mic shouldn't cost us the video.
        stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: false });
      } catch (err2) {
        // A specific lens can vanish; fall back to whatever the phone offers.
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } }, audio: true
          });
        } catch (err3) {
          acquiring = false;
          acquireFailures++;
          if (acquireFailures >= 2) {
            showGate('Camera access was denied or is unavailable. Allow it in Settings › Safari › Camera, then reopen VIDEO.');
          }
          return false;
        }
      }
    }

    acquiring = false;
    acquireFailures = 0;
    mime = pickMime();
    resetZoom();
    preview.srcObject = stream;
    const play = preview.play();
    if (play && play.catch) play.catch(() => {});
    describeSource();
    loadLenses();
    return true;
  }

  // Some cameras hand back a track that is already zoomed in. If the track
  // exposes a zoom capability, wind it all the way back out.
  function resetZoom() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.getCapabilities || !track.applyConstraints) return;
    let caps = null;
    try { caps = track.getCapabilities(); } catch (e) { return; }
    if (!caps || !caps.zoom || typeof caps.zoom.min !== 'number') return;
    track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] })
      .then(describeSource)
      .catch(() => {});
  }

  function releaseCamera() {
    stopDrawing();
    if (canvasStream) {
      canvasStream.getTracks().forEach(t => t.stop());
      canvasStream = null;
    }
    if (!stream) return;
    // stop() is the only thing that actually powers the sensor down;
    // track.enabled = false just blanks the frames.
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    preview.srcObject = null;
  }

  function describeSource() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.getSettings) return;
    let s = {};
    try { s = track.getSettings() || {}; } catch (e) { return; }
    if (!s.width || !s.height) return;
    sourceLabel = s.width + '×' + s.height;
    if (typeof s.zoom === 'number') sourceLabel += ' · zoom ' + s.zoom.toFixed(1) + '×';
    if (!clips.length) tallySub.textContent = 'Source ' + sourceLabel + ' → 1080×1920';
  }

  // ---- lenses -------------------------------------------------------------

  // Labels are only populated once camera permission has been granted, so this
  // runs after the first successful acquire.
  function loadLenses() {
    if (lensesLoaded || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    navigator.mediaDevices.enumerateDevices().then(devices => {
      const cams = devices.filter(d => d.kind === 'videoinput' && d.deviceId);
      if (!cams.length) return;

      // Prefer the rear cameras; a painter filming their easel never wants the
      // selfie camera in the rotation.
      const back = cams.filter(d => /back|rear|environment/i.test(d.label || ''));
      lenses = back.length ? back : cams;
      lensesLoaded = true;

      const savedId = safeGet(LENS_KEY);
      const savedAt = lenses.findIndex(d => d.deviceId === savedId);
      const currentTrack = stream && stream.getVideoTracks()[0];
      let currentId = '';
      try { currentId = currentTrack ? (currentTrack.getSettings().deviceId || '') : ''; } catch (e) {}
      const currentAt = lenses.findIndex(d => d.deviceId === currentId);

      lensIndex = savedAt >= 0 ? savedAt : (currentAt >= 0 ? currentAt : 0);

      if (lenses.length > 1) {
        lensBtn.hidden = false;
        renderLens();
      }
    }).catch(() => {});
  }

  function renderLens() {
    const d = lenses[lensIndex];
    if (!d) return;
    lensBtn.textContent = shortLensName(d.label) + (lenses.length > 1 ? '  ⇄' : '');
  }

  function shortLensName(label) {
    if (!label) return 'Lens';
    return label
      .replace(/camera/i, '')
      .replace(/\bback\b/i, '')
      .replace(/\s+/g, ' ')
      .trim() || 'Back';
  }

  function cycleLens() {
    if (state !== 'idle' || lenses.length < 2) return;
    lensIndex = (lensIndex + 1) % lenses.length;
    safeSet(LENS_KEY, lenses[lensIndex].deviceId);
    renderLens();
    lensBtn.disabled = true;
    releaseCamera();
    acquireCamera().then(() => { lensBtn.disabled = false; });
  }

  function safeGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- 9:16 shaping -------------------------------------------------------

  // Always route through the canvas so the file is exactly 1080x1920 whatever
  // the camera handed us, and so the crop is ours to control rather than
  // something Safari does to the sensor.
  function recordingStream() {
    const track = stream.getVideoTracks()[0];
    let s = {};
    try { s = track.getSettings ? (track.getSettings() || {}) : {}; } catch (e) {}
    const w = s.width, h = s.height;

    if (w && h && h > w && Math.abs((w / h) - (TARGET_W / TARGET_H)) < 0.02) {
      return stream;   // already exactly Reels-shaped; no need to redraw
    }

    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.width = TARGET_W;
      canvas.height = TARGET_H;
      canvasCtx = canvas.getContext('2d', { alpha: false });
    }
    if (!canvasStream) canvasStream = canvas.captureStream(TARGET_FPS);

    startDrawing();

    const tracks = canvasStream.getVideoTracks().slice();
    const audio = stream.getAudioTracks();
    if (audio.length) tracks.push(audio[0]);
    return new MediaStream(tracks);
  }

  function startDrawing() {
    if (drawing) return;
    drawing = true;
    let last = 0;
    const minGap = 1000 / TARGET_FPS;

    const step = now => {
      if (!drawing) return;
      requestAnimationFrame(step);
      // The 16 Pro Max display runs at up to 120 Hz; throttle to 30 so we
      // aren't compositing four times more often than we record.
      if (now - last < minGap) return;
      last = now;

      const vw = preview.videoWidth, vh = preview.videoHeight;
      if (!vw || !vh) return;
      // Cover: fill 1080x1920, cropping the long axis. Taking the minimum
      // instead would letterbox, and Instagram would just crop it anyway.
      const scale = Math.max(TARGET_W / vw, TARGET_H / vh);
      const dw = vw * scale, dh = vh * scale;
      canvasCtx.drawImage(preview, (TARGET_W - dw) / 2, (TARGET_H - dh) / 2, dw, dh);
    };
    requestAnimationFrame(step);
  }

  function stopDrawing() { drawing = false; }

  // ---- session ------------------------------------------------------------

  async function start() {
    if (state !== 'idle') return;
    sheet.hidden = true;
    startBtn.disabled = true;
    lensBtn.disabled = true;

    setStatus('warming', 'Waking camera…');
    const ok = await acquireCamera();
    if (!ok) { startBtn.disabled = false; lensBtn.disabled = false; setStatus('ready', 'Ready'); return; }

    anchor = Date.now();
    nextIndex = 0;
    state = 'warming';
    stopBtn.disabled = false;
    keepAwake();
    loop();
  }

  function stop(note) {
    if (state === 'idle') return;
    state = 'idle';
    clearTimeout(tickTimer); tickTimer = null;
    clearTimeout(clipTimer); clipTimer = null;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    releaseWake();
    startBtn.disabled = false;
    lensBtn.disabled = false;
    stopBtn.disabled = true;
    recFrame.classList.remove('on');
    dial.classList.remove('rec');
    dial.classList.remove('asleep');
    dialNum.textContent = '--';
    setStatus('ready', note || 'Ready');
    setTimeout(() => {
      showSheet();
      acquireCamera();   // preview back so the phone can be re-aimed
    }, 400);
  }

  // Adaptive pacing: one wake a second while idling, tight only when a clip
  // boundary is close.
  function nextDelay() {
    if (state === 'recording') return 250;
    if (state === 'warming') return 100;
    const untilWake = (anchor + nextIndex * CYCLE_MS - WARMUP_MS) - Date.now();
    if (untilWake > 5000) return 1000;
    return 200;
  }

  function loop() {
    tick();
    if (state !== 'idle') tickTimer = setTimeout(loop, nextDelay());
  }

  function tick() {
    const now = Date.now();
    const due = anchor + nextIndex * CYCLE_MS;

    if (state === 'waiting') {
      setDial(Math.ceil((due - now) / 1000), 'until next clip');
      if (now >= due - WARMUP_MS) {
        state = 'warming';
        setStatus('warming', 'Waking camera…');
        dial.classList.remove('asleep');
        acquireCamera().then(ok => {
          if (!ok && state === 'warming') state = 'waiting';   // retry next tick
        });
      }
    } else if (state === 'warming') {
      setDial(Math.ceil((due - now) / 1000), 'until next clip');
      if (now >= due && stream) beginClip();
    } else if (state === 'recording') {
      setDial(Math.ceil((clipEnd - now) / 1000), 'seconds left in clip');
    }
  }

  function beginClip() {
    if (state !== 'warming' || !stream) return;

    let target;
    try {
      target = recordingStream();
      recorder = new MediaRecorder(target, {
        mimeType: mime || undefined,
        videoBitsPerSecond: VIDEO_BPS,
        audioBitsPerSecond: AUDIO_BPS
      });
    } catch (err) {
      try {
        recorder = new MediaRecorder(target || stream, mime ? { mimeType: mime } : undefined);
      } catch (err2) {
        stop('Recorder failed');
        showGate('This browser refused to start a recording: ' + err2.message);
        return;
      }
    }

    chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = clipStopped;
    recorder.start();

    state = 'recording';
    clipStartedAt = Date.now();
    clipEnd = clipStartedAt + CLIP_MS;
    nextIndex++;
    setStatus('rec', 'Recording');
    recFrame.classList.add('on');
    dial.classList.add('rec');
    setDial(CLIP_MS / 1000, 'seconds left in clip');

    clipTimer = setTimeout(() => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    }, CLIP_MS);
  }

  function clipStopped() {
    const type = mime || 'video/mp4';
    const blob = new Blob(chunks, { type });
    chunks = [];
    stopDrawing();

    if (blob.size) {
      const ext = type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
      clips.push(new File([blob], 'Clip_' + stamp(clipStartedAt) + '.' + ext, { type }));
      totalBytes += blob.size;
      renderTally();
    }

    recFrame.classList.remove('on');
    dial.classList.remove('rec');

    // If STOP was pressed mid-clip we're already idle — leave it that way.
    if (state !== 'recording') return;

    // Power the camera down until shortly before the next clip.
    if (!keepCameraAwake) releaseCamera();

    state = 'waiting';
    setStatus('waiting', keepCameraAwake ? 'Waiting' : 'Waiting · camera asleep');
    dial.classList.add('asleep');
    tick();
  }

  // ---- saving -------------------------------------------------------------

  function showSheet() {
    if (!clips.length) return;
    sheetSummary.textContent =
      clips.length + ' clip' + (clips.length === 1 ? '' : 's') + ' · ' + mb(totalBytes) + ' MB · ready for Reels';
    sheet.hidden = false;
  }

  // navigator.share must be called straight from the tap — no awaits before
  // it, or iOS drops the user-gesture and refuses.
  saveBtn.addEventListener('click', () => {
    if (!clips.length) return;
    if (navigator.canShare && navigator.canShare({ files: clips })) {
      navigator.share({ files: clips })
        .then(() => { clips = []; totalBytes = 0; renderTally(); sheet.hidden = true; })
        .catch(() => {});
    } else {
      downloadAll();
    }
  });

  laterBtn.addEventListener('click', () => { sheet.hidden = true; });

  function downloadAll() {
    clips.forEach((file, i) => setTimeout(() => {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }, i * 900));
  }

  // ---- screen wake --------------------------------------------------------

  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && state !== 'idle') {
      stop('Stopped — app left the screen');
    } else if (document.visibilityState === 'visible' && state !== 'idle') {
      keepAwake();
    }
  });

  // ---- rendering ----------------------------------------------------------

  function showGate(text) {
    gateText.textContent = text;
    gateBtn.textContent = 'TRY AGAIN';
    gate.hidden = false;
  }

  function setStatus(kind, text) {
    dot.className = 'dot ' + kind;
    if (statusText.textContent !== text) statusText.textContent = text;
  }

  function setDial(seconds, caption) {
    const s = Math.max(0, seconds);
    const text = s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s);
    if (dialNum.textContent !== text) dialNum.textContent = text;
    if (dialCap.textContent !== caption) dialCap.textContent = caption;
  }

  function renderTally() {
    if (!clips.length) {
      tallyMain.textContent = 'No clips yet';
      tallySub.textContent = sourceLabel ? ('Source ' + sourceLabel + ' → 1080×1920') : 'Reels format · 1080×1920 · 30 fps';
      tallySub.className = '';
      return;
    }
    tallyMain.textContent = clips.length + ' clip' + (clips.length === 1 ? '' : 's') + ' · ' + mb(totalBytes) + ' MB';
    if (clips.length >= 40) {
      tallySub.textContent = 'Getting large — stop and save soon so nothing is lost';
      tallySub.className = 'warn';
    } else {
      tallySub.textContent = 'Not saved yet — press STOP, then Save to Photos';
      tallySub.className = '';
    }
  }

  const mb = bytes => Math.round(bytes / 1048576);

  function stamp(ms) {
    const d = new Date(ms), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' +
           p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
  }

  // ---- wiring -------------------------------------------------------------

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', () => stop());
  lensBtn.addEventListener('click', cycleLens);
  gateBtn.addEventListener('click', () => { gate.hidden = true; acquireFailures = 0; start(); });

  dialCap.textContent = (CLIP_MS / 1000) + 's clip every ' + (CYCLE_MS / 60000) + ' min';

  if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showGate('This browser can’t record video. Open VIDEO in Safari on iOS 15 or later.');
    gateBtn.hidden = true;
    startBtn.disabled = true;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Live preview from the moment the app opens, so the phone can be aimed
  // before starting. The sensor only sleeps between clips once a session runs.
  if (!startBtn.disabled) acquireCamera();
})();
</script>
</body>
</html>
