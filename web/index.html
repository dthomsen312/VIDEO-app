<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VIDEO</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIDEO">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }

  /* Full screen, and `contain` so the ENTIRE recorded frame is visible with
     nothing cropped off the edges by the preview. What you see is exactly what
     is encoded, since clips are now recorded from the camera track untouched. */
  #stage {
    position: fixed; inset: 0;
    overflow: hidden; background: #000;
  }
  #preview {
    display: block; width: 100%; height: 100%;
    object-fit: contain; transform-origin: center center;
  }

  #recFrame {
    position: fixed; inset: 0;
    border: 10px solid #ff3b30;
    pointer-events: none; opacity: 0;
    transition: opacity .15s;
  }
  #recFrame.on { opacity: 1; }

  .ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 16px
             calc(env(safe-area-inset-bottom) + 10px);
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }

  .status {
    display: flex; align-items: center; gap: 10px; align-self: flex-start;
    background: rgba(0,0,0,.55); border-radius: 999px;
    padding: 11px 18px; font-size: 20px; font-weight: 700;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #888; }
  .dot.ready { background: #fff; }
  .dot.waiting { background: #ffd60a; }
  .dot.warming { background: #ff9f0a; }
  .dot.rec { background: #ff3b30; }

  /* Zoom selector, top right, mirroring the stock Camera app's steps. */
  #rightBar {
    position: fixed; z-index: 6;
    top: calc(env(safe-area-inset-top) + 10px); right: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #zoomBar {
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,.5); border-radius: 999px; padding: 8px;
  }
  #focusBtn {
    width: 70px; height: 44px; border: 0; border-radius: 999px;
    background: rgba(0,0,0,.55); color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 800;
  }
  #focusBtn.on { background: #ffd60a; color: #000; }
  #focusBtn:disabled { opacity: .3; }
  #zoomBar button {
    width: 54px; height: 54px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff;
    font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  #zoomBar button.on { background: #fff; color: #000; }
  #zoomBar button:disabled { opacity: .25; }

  .spacer { flex: 1; }

  .dial {
    background: rgba(0,0,0,.5); border-radius: 28px;
    padding: 16px 30px; text-align: center;
  }
  /* Pure black while the camera sleeps: unlit OLED pixels draw no power. */
  .dial.asleep { background: #000; }
  .dial b {
    display: block; font-size: 88px; line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .dial.rec b { color: #ff3b30; }
  .dial span { font-size: 17px; font-weight: 600; opacity: .85; }

  .settings {
    display: flex; gap: 10px; width: 100%; margin-bottom: 10px;
  }
  .settings label {
    flex: 1; display: flex; flex-direction: column; gap: 4px;
    background: rgba(0,0,0,.5); border-radius: 18px; padding: 8px 12px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,.65);
    text-transform: uppercase; letter-spacing: .4px;
  }
  .settings select {
    -webkit-appearance: none; appearance: none;
    border: 0; background: transparent; color: #fff;
    font-family: inherit; font-size: 19px; font-weight: 800;
    padding: 0; width: 100%;
  }
  .settings label:has(select:disabled) { opacity: .4; }

  .tally {
    background: rgba(0,0,0,.5); border-radius: 18px;
    padding: 10px 16px; margin-bottom: 12px; width: 100%;
    text-align: center; font-size: 17px; font-weight: 600;
  }
  .tally em { display: block; font-style: normal; font-size: 13px; opacity: .7; margin-top: 3px; }
  .tally em.warn { color: #ffd60a; }

  .controls { display: flex; gap: 14px; width: 100%; }
  .big {
    flex: 1; height: 140px; border: 0; border-radius: 26px;
    color: #fff; font-size: 30px; font-weight: 800; letter-spacing: .5px;
    font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .big svg { width: 44px; height: 44px; fill: currentColor; }
  .big.start { background: #30d158; }
  .big.stop  { background: #ff3b30; }
  .big:disabled { opacity: .25; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; text-align: center; gap: 14px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; font-size: 16px; line-height: 1.45; opacity: .85; max-width: 30em; }
  .overlay button {
    border: 0; border-radius: 20px; padding: 20px 28px; width: 100%; max-width: 360px;
    font-size: 22px; font-weight: 800; color: #fff; background: #0a84ff; font-family: inherit;
  }
  .overlay button.ghost { background: transparent; color: #9b9ba1; font-size: 17px; padding: 12px; }
</style>
</head>
<body>

<div id="stage"><video id="preview" playsinline autoplay muted></video></div>
<div id="recFrame"></div>

<div id="rightBar">
<div id="zoomBar">
  <button data-z="0.5">.5</button>
  <button data-z="1" class="on">1×</button>
  <button data-z="2">2</button>
  <button data-z="5">5</button>
</div>
<button id="focusBtn">AF</button>
</div>

<div class="ui">
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Ready</span></div>
  <div class="spacer"></div>
  <div class="dial" id="dial"><b id="dialNum">--</b><span id="dialCap">10s clip every 2 min</span></div>
  <div class="spacer"></div>
  <div class="settings">
    <label>Clip length<select id="clipSel"></select></label>
    <label>Every<select id="cycleSel"></select></label>
  </div>
  <div class="tally"><span id="tallyMain">No clips yet</span><em id="tallySub">HD · 30 fps</em></div>
  <div class="controls">
    <button class="big start" id="startBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>START
    </button>
    <button class="big stop" id="stopBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>STOP
    </button>
  </div>
</div>

<div class="overlay" id="gate" hidden>
  <h2>VIDEO</h2>
  <p id="gateText">This app needs your camera and microphone to record clips.</p>
  <button id="gateBtn">ENABLE CAMERA</button>
</div>

<div class="overlay" id="sheet" hidden>
  <h2>Session finished</h2>
  <p id="sheetSummary"></p>
  <button id="saveBtn">SAVE TO PHOTOS</button>
  <p>Choose <b>Save Videos</b> in the share sheet. They land in Photos under Recents.</p>
  <button class="ghost" id="laterBtn">Keep recording instead</button>
</div>

<script>
(() => {
  'use strict';

  // ---- Output ------------------------------------------------------------
  // At 1x the camera track is recorded exactly as it comes: native resolution,
  // native aspect ratio, no crop, no rescale, nothing warped. Instagram accepts
  // that and re-encodes to 1080 wide anyway. TARGET_W/H are only used for the
  // 2x canvas crop, which is the one case that has to redraw.
  const TARGET_W  = 1080;
  const TARGET_H  = 1920;
  const TARGET_FPS = 30;
  const VIDEO_BPS = 10000000;
  const AUDIO_BPS = 128000;

  const WARMUP_MS = 3000;

  // Selectable clip length and spacing. An interval must leave room for the
  // clip plus the camera warm-up, so shorter options get disabled as the clip
  // length grows rather than silently producing back-to-back recordings.
  const CLIP_CHOICES  = [3, 5, 10, 15, 20, 30, 45, 60];
  const CYCLE_CHOICES = [15, 30, 60, 120, 180, 300, 600, 900, 1800, 3600];

  let clipMs  = 10000;
  let cycleMs = 120000;

  const ZOOM_KEY = 'video.zoom';
  const CLIP_KEY = 'video.clipSec';
  const CYCLE_KEY = 'video.cycleSec';

  // On an iPhone 16 Pro Max: .5 is the ultra wide, 1 is the 24mm main camera,
  // 5 is the tetraprism telephoto. 2 has no lens of its own — the stock Camera
  // app makes it by cropping the middle of the main sensor, which is what
  // `digital: 2` does here, raising capture resolution first so the crop lands
  // on real pixels.
  const PRESETS = [
    { z: 0.5, lens: 'ultra', digital: 1 },
    { z: 1,   lens: 'wide',  digital: 1 },
    { z: 2,   lens: 'wide',  digital: 2 },
    { z: 5,   lens: 'tele',  digital: 1 }
  ];

  const $ = id => document.getElementById(id);
  const preview = $('preview'), recFrame = $('recFrame'), dial = $('dial');
  const dot = $('dot'), statusText = $('statusText');
  const dialNum = $('dialNum'), dialCap = $('dialCap');
  const tallyMain = $('tallyMain'), tallySub = $('tallySub');
  const startBtn = $('startBtn'), stopBtn = $('stopBtn');
  const zoomBar = $('zoomBar'), focusBtn = $('focusBtn');
  const clipSel = $('clipSel'), cycleSel = $('cycleSel');
  const gate = $('gate'), gateText = $('gateText'), gateBtn = $('gateBtn');
  const sheet = $('sheet'), sheetSummary = $('sheetSummary');
  const saveBtn = $('saveBtn'), laterBtn = $('laterBtn');

  let stream = null, mime = '', recorder = null, chunks = [];
  let clips = [], totalBytes = 0;
  let state = 'idle';
  let anchor = 0, nextIndex = 0, clipEnd = 0, clipStartedAt = 0;
  let tickTimer = null, clipTimer = null, wakeLock = null;
  let acquiring = false, acquireFailures = 0;
  let sourceLabel = '';

  let cams = { ultra: null, wide: null, tele: null };
  let camsLoaded = false;
  let preset = PRESETS[1];        // 1× default
  let activeLensId = '';          // deviceId currently open
  let cropFactor = 1;             // digital zoom applied in the canvas
  let focusLocked = false, focusSupported = true;

  let canvas = null, canvasCtx = null, canvasStream = null, drawing = false;

  // ---- codec --------------------------------------------------------------

  function pickMime() {
    const options = [
      'video/mp4;codecs=avc1.640028,mp4a.40.2',
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    if (typeof MediaRecorder === 'undefined') return null;
    const found = options.find(t => MediaRecorder.isTypeSupported(t));
    return found === undefined ? '' : found;
  }

  // ---- capture ------------------------------------------------------------

  // 1920x1080 is one of iOS Safari's own native capture formats, so asking for
  // it gets HD directly without the sensor being cropped to fit. Asking for a
  // NON-native shape (a square, or 3:4) is what previously made Safari crop in
  // and look zoomed. Asking for nothing at all was worse: Safari then defaults
  // to 640x480, which is where the blur came from.
  function openConstraints(p) {
    const video = {
      width:  { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: TARGET_FPS, max: TARGET_FPS },
      resizeMode: { ideal: 'none' },
      advanced: [{ focusMode: 'continuous' }]
    };
    const dev = cams[p.lens];
    if (dev) video.deviceId = { exact: dev.deviceId };
    else video.facingMode = { ideal: 'environment' };
    return video;
  }

  // Only needed when a digital crop is coming: capture higher so the crop
  // lands on real pixels. Never gated on getCapabilities — Safari often omits
  // it, and gating on it is what silently left capture at 640x480.
  function raiseResolution(track, digital) {
    if (digital <= 1) return Promise.resolve();
    if (!track.getSettings || !track.applyConstraints) return Promise.resolve();

    let s0 = {};
    try { s0 = track.getSettings() || {}; } catch (e) { return Promise.resolve(); }
    if (!s0.width || !s0.height) return Promise.resolve();

    const ar = s0.width / s0.height;
    const longEdge = Math.min(3840, Math.max(s0.width, s0.height) * digital);
    const w = ar >= 1 ? Math.round(longEdge) : Math.round(longEdge * ar);
    const h = ar >= 1 ? Math.round(longEdge / ar) : Math.round(longEdge);

    return track.applyConstraints({
      width: { ideal: w }, height: { ideal: h },
      frameRate: { ideal: TARGET_FPS, max: TARGET_FPS }
    }).then(() => {
      let s1 = {};
      try { s1 = track.getSettings() || {}; } catch (e) { return; }
      if (!s1.width || !s1.height) return;
      // Aspect ratio moved => it cropped rather than scaled. Undo.
      if (Math.abs((s1.width / s1.height) - ar) > 0.02) {
        return track.applyConstraints({
          width: { ideal: s0.width }, height: { ideal: s0.height },
          frameRate: { ideal: TARGET_FPS, max: TARGET_FPS }
        }).catch(() => {});
      }
    }).catch(() => {});
  }

  async function acquireCamera() {
    if (stream) return true;
    if (acquiring) return false;
    acquiring = true;

    const video = openConstraints(preset);

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
    } catch (err) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: false });
      } catch (err2) {
        try {
          // Requested lens unavailable — fall back to whatever the phone gives.
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } }, audio: true
          });
        } catch (err3) {
          acquiring = false;
          acquireFailures++;
          if (acquireFailures >= 2) {
            showGate('Camera access was denied or is unavailable. Allow it in Settings › Safari › Camera, then reopen VIDEO.');
          }
          return false;
        }
      }
    }

    acquiring = false;
    acquireFailures = 0;
    mime = pickMime();

    const track = stream.getVideoTracks()[0];
    try { activeLensId = (track.getSettings() || {}).deviceId || ''; } catch (e) { activeLensId = ''; }

    await raiseResolution(track, preset.digital);
    applyFocus();
    applyZoom();
    preview.srcObject = stream;
    const play = preview.play();
    if (play && play.catch) play.catch(() => {});
    describeSource();
    loadCameras();
    return true;
  }

  // Prefer real optical zoom when the track exposes it; otherwise the canvas
  // crop does the work. Safari on iOS generally does not expose zoom, so this
  // is a bonus path rather than the main one.
  function applyZoom() {
    cropFactor = preset.digital;
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.getCapabilities || !track.applyConstraints) { updatePreviewZoom(); return; }

    let caps = null;
    try { caps = track.getCapabilities(); } catch (e) { caps = null; }

    if (!caps || !caps.zoom || typeof caps.zoom.max !== 'number') { updatePreviewZoom(); return; }

    const want = Math.max(caps.zoom.min, Math.min(caps.zoom.max, preset.digital));
    track.applyConstraints({ advanced: [{ zoom: want }] }).then(() => {
      let got = 1;
      try { got = track.getSettings().zoom || 1; } catch (e) {}
      // Only stop cropping if the hardware actually delivered the zoom.
      if (Math.abs(got - preset.digital) < 0.05) cropFactor = 1;
      updatePreviewZoom();
      describeSource();
    }).catch(() => { updatePreviewZoom(); });
  }

  // The preview is transformed by the same factor the canvas crops by, so what
  // is on screen is what lands in the file.
  function updatePreviewZoom() {
    preview.style.transform = cropFactor === 1 ? '' : 'scale(' + cropFactor + ')';
  }

  // Continuous autofocus by default. Locking pins focus where it is, so a hand
  // passing in front of the easel can't make the camera hunt mid-clip.
  function applyFocus() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.applyConstraints) return;

    const modes = focusLocked ? ['manual', 'single-shot'] : ['continuous'];

    const attempt = i => {
      if (i >= modes.length) { markFocusUnsupported(); return; }
      track.applyConstraints({ advanced: [{ focusMode: modes[i] }] })
        .then(() => { focusSupported = true; renderFocus(); })
        .catch(() => attempt(i + 1));
    };
    attempt(0);
  }

  function markFocusUnsupported() {
    // Safari may not expose focusMode at all; it still autofocuses on its own.
    focusSupported = false;
    focusLocked = false;
    renderFocus();
  }

  function renderFocus() {
    focusBtn.textContent = focusLocked ? 'AF-L' : 'AF';
    focusBtn.classList.toggle('on', focusLocked);
    focusBtn.disabled = !focusSupported;
    focusBtn.title = focusSupported ? '' : 'Focus control not available in this browser';
  }

  function toggleFocus() {
    if (!focusSupported) return;
    focusLocked = !focusLocked;
    renderFocus();
    applyFocus();
  }

  function releaseCamera() {
    stopDrawing();
    if (canvasStream) {
      canvasStream.getTracks().forEach(t => t.stop());
      canvasStream = null;
    }
    if (!stream) return;
    // stop() is the only thing that powers the sensor down; setting
    // track.enabled = false just blanks the frames.
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    preview.srcObject = null;
  }

  function describeSource() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || !track.getSettings) return;
    let s = {};
    try { s = track.getSettings() || {}; } catch (e) { return; }
    if (!s.width || !s.height) return;
    sourceLabel = s.width + '×' + s.height + ' · ' + zoomText(preset.z);
    if (cropFactor > 1) sourceLabel += ' crop';
    if (!clips.length) tallySub.textContent = sourceLabel + (cropFactor > 1 ? ' → 1080×1920' : ' · recorded as-is');
  }

  const zoomText = z => (z === 1 ? '1×' : (z + '×'));

  // ---- lenses -------------------------------------------------------------

  // Device labels only appear once camera permission has been granted, so this
  // runs after the first successful acquire.
  function loadCameras() {
    if (camsLoaded || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    navigator.mediaDevices.enumerateDevices().then(devices => {
      const vids = devices.filter(d => d.kind === 'videoinput' && d.deviceId);
      if (!vids.length) return;
      camsLoaded = true;

      const back = vids.filter(d => !/front|face|selfie/i.test(d.label || ''));
      const pool = back.length ? back : vids;

      cams.ultra = pool.find(d => /ultra/i.test(d.label || '')) || null;
      cams.tele  = pool.find(d => /tele/i.test(d.label || '')) || null;
      cams.wide  = pool.find(d => /back camera$/i.test((d.label || '').trim()))
                || pool.find(d => /dual wide|triple|dual/i.test(d.label || ''))
                || pool.find(d => d !== cams.ultra && d !== cams.tele)
                || pool[0];

      renderZoomBar();
    }).catch(() => {});
  }

  function renderZoomBar() {
    Array.prototype.forEach.call(zoomBar.children, btn => {
      const z = parseFloat(btn.getAttribute('data-z'));
      const p = PRESETS.find(x => x.z === z);
      btn.classList.toggle('on', p === preset);
      // 0.5x needs a real ultra-wide; you cannot digitally zoom outwards.
      btn.disabled = camsLoaded && p.z === 0.5 && !cams.ultra;
    });
  }

  function chooseZoom(z) {
    const p = PRESETS.find(x => x.z === z);
    if (!p || p === preset || state === 'recording') return;

    const prevLens = preset.lens;
    preset = p;
    safeSet(ZOOM_KEY, String(z));
    renderZoomBar();

    const needsNewLens = prevLens !== p.lens || !stream;
    if (!stream) { describeSource(); return; }   // asleep; takes effect on next wake

    if (needsNewLens) {
      releaseCamera();
      acquireCamera();
    } else {
      applyZoom();          // same lens, digital-only change — instant
      describeSource();
    }
  }

  function safeGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- clip length / interval ---------------------------------------------

  const durationLabel = sec => {
    if (sec < 60) return sec + ' sec';
    const m = sec / 60;
    return (m % 1 === 0 ? m : m.toFixed(1)) + (m === 1 ? ' min' : ' min');
  };

  function buildDurationMenus() {
    CLIP_CHOICES.forEach(sec => {
      const o = document.createElement('option');
      o.value = String(sec); o.textContent = durationLabel(sec);
      clipSel.appendChild(o);
    });
    CYCLE_CHOICES.forEach(sec => {
      const o = document.createElement('option');
      o.value = String(sec); o.textContent = durationLabel(sec);
      cycleSel.appendChild(o);
    });

    const savedClip = parseInt(safeGet(CLIP_KEY), 10);
    const savedCycle = parseInt(safeGet(CYCLE_KEY), 10);
    if (CLIP_CHOICES.indexOf(savedClip) !== -1) clipMs = savedClip * 1000;
    if (CYCLE_CHOICES.indexOf(savedCycle) !== -1) cycleMs = savedCycle * 1000;

    clipSel.value = String(clipMs / 1000);
    cycleSel.value = String(cycleMs / 1000);
    syncDurationMenus();

    clipSel.addEventListener('change', () => {
      clipMs = parseInt(clipSel.value, 10) * 1000;
      safeSet(CLIP_KEY, clipSel.value);
      syncDurationMenus();
    });
    cycleSel.addEventListener('change', () => {
      cycleMs = parseInt(cycleSel.value, 10) * 1000;
      safeSet(CYCLE_KEY, cycleSel.value);
      syncDurationMenus();
    });
  }

  // Grey out any interval that can't fit the clip plus warm-up, and pull the
  // current selection up to the shortest legal one if it no longer fits.
  function syncDurationMenus() {
    const minCycle = (clipMs + WARMUP_MS) / 1000;
    let firstLegal = null;

    Array.prototype.forEach.call(cycleSel.options, o => {
      const sec = parseInt(o.value, 10);
      o.disabled = sec < minCycle;
      if (!o.disabled && firstLegal === null) firstLegal = sec;
    });

    if (cycleMs / 1000 < minCycle && firstLegal !== null) {
      cycleMs = firstLegal * 1000;
      cycleSel.value = String(firstLegal);
      safeSet(CYCLE_KEY, cycleSel.value);
    }
    renderSchedule();
  }

  function renderSchedule() {
    dialCap.textContent = durationLabel(clipMs / 1000) + ' clip every ' + durationLabel(cycleMs / 1000);
  }

  function setDurationMenusEnabled(on) {
    clipSel.disabled = !on;
    cycleSel.disabled = !on;
  }

  // ---- shaping ------------------------------------------------------------

  function recordingStream() {
    // No digital zoom => hand MediaRecorder the camera's own track untouched.
    // No canvas redraw, no rescale, no crop: whatever the sensor gives is what
    // gets encoded, at full sharpness and with nothing distorted. Routing every
    // clip through the canvas is what softened the footage.
    if (cropFactor === 1) return stream;

    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.width = TARGET_W;
      canvas.height = TARGET_H;
      canvasCtx = canvas.getContext('2d', { alpha: false });
    }
    if (!canvasStream) canvasStream = canvas.captureStream(TARGET_FPS);

    startDrawing();

    const tracks = canvasStream.getVideoTracks().slice();
    const audio = stream.getAudioTracks();
    if (audio.length) tracks.push(audio[0]);
    return new MediaStream(tracks);
  }

  function startDrawing() {
    if (drawing) return;
    drawing = true;
    let last = 0;
    const minGap = 1000 / TARGET_FPS;

    const step = now => {
      if (!drawing) return;
      requestAnimationFrame(step);
      // The 16 Pro Max panel runs up to 120 Hz; throttle to 30 so we aren't
      // compositing four times more often than we record.
      if (now - last < minGap) return;
      last = now;

      const vw = preview.videoWidth, vh = preview.videoHeight;
      if (!vw || !vh) return;
      const scale = Math.max(TARGET_W / vw, TARGET_H / vh) * cropFactor;
      const dw = vw * scale, dh = vh * scale;
      canvasCtx.drawImage(preview, (TARGET_W - dw) / 2, (TARGET_H - dh) / 2, dw, dh);
    };
    requestAnimationFrame(step);
  }

  function stopDrawing() { drawing = false; }

  // ---- session ------------------------------------------------------------

  async function start() {
    if (state !== 'idle') return;
    sheet.hidden = true;
    startBtn.disabled = true;

    setStatus('warming', 'Waking camera…');
    const ok = await acquireCamera();
    if (!ok) { startBtn.disabled = false; setDurationMenusEnabled(true); setStatus('ready', 'Ready'); return; }

    anchor = Date.now();
    nextIndex = 0;
    state = 'warming';
    stopBtn.disabled = false;
    setDurationMenusEnabled(false);
    keepAwake();
    loop();
  }

  function stop(note) {
    if (state === 'idle') return;
    state = 'idle';
    clearTimeout(tickTimer); tickTimer = null;
    clearTimeout(clipTimer); clipTimer = null;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    releaseWake();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setDurationMenusEnabled(true);
    recFrame.classList.remove('on');
    dial.classList.remove('rec');
    dial.classList.remove('asleep');
    dialNum.textContent = '--';
    setStatus('ready', note || 'Ready');
    setTimeout(() => { showSheet(); acquireCamera(); }, 400);
  }

  function nextDelay() {
    if (state === 'recording') return 250;
    if (state === 'warming') return 100;
    const untilWake = (anchor + nextIndex * cycleMs - WARMUP_MS) - Date.now();
    if (untilWake > 5000) return 1000;
    return 200;
  }

  function loop() {
    tick();
    if (state !== 'idle') tickTimer = setTimeout(loop, nextDelay());
  }

  function tick() {
    const now = Date.now();
    const due = anchor + nextIndex * cycleMs;

    if (state === 'waiting') {
      setDial(Math.ceil((due - now) / 1000), 'until next clip');
      if (now >= due - WARMUP_MS) {
        state = 'warming';
        setStatus('warming', 'Waking camera…');
        dial.classList.remove('asleep');
        acquireCamera().then(ok => {
          if (!ok && state === 'warming') state = 'waiting';
        });
      }
    } else if (state === 'warming') {
      setDial(Math.ceil((due - now) / 1000), 'until next clip');
      if (now >= due && stream) beginClip();
    } else if (state === 'recording') {
      setDial(Math.ceil((clipEnd - now) / 1000), 'seconds left in clip');
    }
  }

  function beginClip() {
    if (state !== 'warming' || !stream) return;

    let target;
    try {
      target = recordingStream();
      recorder = new MediaRecorder(target, {
        mimeType: mime || undefined,
        videoBitsPerSecond: VIDEO_BPS,
        audioBitsPerSecond: AUDIO_BPS
      });
    } catch (err) {
      try {
        recorder = new MediaRecorder(target || stream, mime ? { mimeType: mime } : undefined);
      } catch (err2) {
        stop('Recorder failed');
        showGate('This browser refused to start a recording: ' + err2.message);
        return;
      }
    }

    chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = clipStopped;
    recorder.start();

    state = 'recording';
    clipStartedAt = Date.now();
    clipEnd = clipStartedAt + clipMs;
    nextIndex++;
    setStatus('rec', 'Recording');
    recFrame.classList.add('on');
    dial.classList.add('rec');
    setDial(clipMs / 1000, 'seconds left in clip');

    clipTimer = setTimeout(() => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    }, clipMs);
  }

  function clipStopped() {
    const type = mime || 'video/mp4';
    const blob = new Blob(chunks, { type });
    chunks = [];
    stopDrawing();

    if (blob.size) {
      const ext = type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
      clips.push(new File([blob], 'Clip_' + stamp(clipStartedAt) + '.' + ext, { type }));
      totalBytes += blob.size;
      renderTally();
    }

    recFrame.classList.remove('on');
    dial.classList.remove('rec');

    if (state !== 'recording') return;   // STOP was pressed mid-clip

    releaseCamera();                     // sensor off until just before the next clip
    state = 'waiting';
    setStatus('waiting', 'Waiting · camera asleep');
    dial.classList.add('asleep');
    tick();
  }

  // ---- saving -------------------------------------------------------------

  function showSheet() {
    if (!clips.length) return;
    sheetSummary.textContent =
      clips.length + ' clip' + (clips.length === 1 ? '' : 's') + ' · ' + mb(totalBytes) + ' MB · ready for Reels';
    sheet.hidden = false;
  }

  // navigator.share must be called straight from the tap — no awaits before it,
  // or iOS drops the user gesture and refuses.
  saveBtn.addEventListener('click', () => {
    if (!clips.length) return;
    if (navigator.canShare && navigator.canShare({ files: clips })) {
      navigator.share({ files: clips })
        .then(() => { clips = []; totalBytes = 0; renderTally(); sheet.hidden = true; })
        .catch(() => {});
    } else {
      downloadAll();
    }
  });

  laterBtn.addEventListener('click', () => { sheet.hidden = true; });

  function downloadAll() {
    clips.forEach((file, i) => setTimeout(() => {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }, i * 900));
  }

  // ---- screen wake --------------------------------------------------------

  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && state !== 'idle') {
      stop('Stopped — app left the screen');
    } else if (document.visibilityState === 'visible' && state !== 'idle') {
      keepAwake();
    }
  });

  // ---- rendering ----------------------------------------------------------

  function showGate(text) {
    gateText.textContent = text;
    gateBtn.textContent = 'TRY AGAIN';
    gate.hidden = false;
  }

  function setStatus(kind, text) {
    dot.className = 'dot ' + kind;
    if (statusText.textContent !== text) statusText.textContent = text;
  }

  function setDial(seconds, caption) {
    const s = Math.max(0, seconds);
    const text = s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s);
    if (dialNum.textContent !== text) dialNum.textContent = text;
    if (dialCap.textContent !== caption) dialCap.textContent = caption;
  }

  function renderTally() {
    if (!clips.length) {
      tallyMain.textContent = 'No clips yet';
      tallySub.textContent = sourceLabel || 'HD · 30 fps';
      tallySub.className = '';
      return;
    }
    tallyMain.textContent = clips.length + ' clip' + (clips.length === 1 ? '' : 's') + ' · ' + mb(totalBytes) + ' MB';
    // Size, not clip count: at 1-minute clips this fills up far faster.
    if (totalBytes > 1500000000 || clips.length >= 60) {
      tallySub.textContent = 'Getting large — stop and save soon so nothing is lost';
      tallySub.className = 'warn';
    } else {
      tallySub.textContent = 'Not saved yet — press STOP, then Save to Photos';
      tallySub.className = '';
    }
  }

  const mb = bytes => Math.round(bytes / 1048576);

  function stamp(ms) {
    const d = new Date(ms), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' +
           p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
  }

  // ---- wiring -------------------------------------------------------------

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', () => stop());
  gateBtn.addEventListener('click', () => { gate.hidden = true; acquireFailures = 0; start(); });

  focusBtn.addEventListener('click', toggleFocus);

  zoomBar.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    chooseZoom(parseFloat(btn.getAttribute('data-z')));
  });

  const savedZoom = parseFloat(safeGet(ZOOM_KEY));
  const savedPreset = PRESETS.find(p => p.z === savedZoom);
  if (savedPreset) preset = savedPreset;
  renderZoomBar();
  renderFocus();

  buildDurationMenus();

  if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showGate('This browser can’t record video. Open VIDEO in Safari on iOS 15 or later.');
    gateBtn.hidden = true;
    startBtn.disabled = true;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Live preview from the moment the app opens so the phone can be aimed. The
  // sensor only sleeps between clips once a session is running.
  if (!startBtn.disabled) acquireCamera();
})();
</script>
</body>
</html>
